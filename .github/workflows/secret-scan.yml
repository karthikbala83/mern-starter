name: secret-scan

# Blocks/flags exposed secrets (API keys, tokens) on every push and PR.
# Runs the gitleaks CLI directly -- free on personal accounts, no action license,
# and portable to any CI provider. A detected secret fails this check (the red X
# is the alert); the value is redacted from logs.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          set -euo pipefail
          # Pinned version (no api.github.com call -> no unauthenticated rate-limit 403s).
          # The releases/download URL is CDN-served, safe under concurrency.
          VER=8.30.1
          curl -sSfL --retry 3 --retry-delay 5 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
